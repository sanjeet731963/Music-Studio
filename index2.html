<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spotify Web Player</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: white;
    }

    .sidebar {
      width: 200px;
      background-color: #000;
      padding: 20px;
      height: 100vh;
      float: left;
    }

    .sidebar h3 {
      text-transform: uppercase;
      font-size: 16px;
      color: #ccc;
      margin-bottom: 10px;
    }

    .sidebar a {
      display: block;
      color: white;
      margin: 10px 0;
      text-decoration: none;
    }

    .main {
      margin-left: 220px;
      padding: 20px;
    }

    .playlist-title {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: #1e1e1e;
      padding: 10px;
      border-radius: 8px;
      position: relative;
    }

    .card img {
      width: 100%;
      border-radius: 8px;
    }

    .card h4 {
      margin: 10px 0 5px;
    }

    .card p {
      margin: 0;
      font-size: 12px;
      color: #aaa;
    }

    .play-btn {
      position: absolute;
      bottom: 50px;
      right: 10px;
      background-color: #1db954;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-size: 18px;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player {
      position: fixed;
      bottom: 0;
      left: 220px;
      right: 0;
      height: 80px;
      background-color: #181818;
      display: flex;
      align-items: center;
      padding: 0 20px;
      box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.5);
    }

    .progress-bar {
      width: 100%;
      margin-left: 20px;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h3>Home</h3>
    <a href="#">Home</a>
    <a href="#">Search</a>
    <h3>Your Library</h3>
  </div>

  <div class="main">
    <div class="playlist-title">Spotify Playlist</div>
    <div class="cards">
      <div class="card">
        <img src="cover.jpg"alt="cover">
        <h4>Happy Hits</h4>
        <p>Feel-good music to boost your mood.</p>
        <button class="play-btn">&#9658;</button>
      </div>
    </div>
  </div>

  <div class="player">
    <span>Now Playing</span>
    <input type="range" class="progress-bar" min="0" max="100" value="0">
  </div>

  <audio id="audio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

  <script>
    const playBtn = document.querySelector('.play-btn');
    const audio = document.getElementById('audio');
    const progressBar = document.querySelector('.progress-bar');

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playBtn.innerHTML = '❚❚';
      } else {
        audio.pause();
        playBtn.innerHTML = '&#9658;';
      }
    });

    audio.addEventListener('timeupdate', () => {
      progressBar.value = audio.currentTime;
      progressBar.max = audio.duration;
    });

    progressBar.addEventListener('input', () => {
      audio.currentTime = progressBar.value;
    });
  </script>
</body>
</html>
